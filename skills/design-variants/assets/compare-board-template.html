<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__GSTACK_FEATURE_TITLE__ - Design Variants</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #171717;
      --muted: #66645f;
      --line: #d8d6cf;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --warn: #9f3a12;
      --radius: 8px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 247, 244, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    .summary {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      vertical-align: top;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.04em;
      background: #fbfbf9;
    }

    tr:last-child td { border-bottom: 0; }

    a {
      color: var(--accent);
      font-weight: 650;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .variants {
      display: grid;
      gap: 20px;
      margin-top: 20px;
    }

    .variant {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .variant-head {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .variant-title {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .variant-desc {
      margin: 0;
      color: var(--muted);
      max-width: 780px;
    }

    .open-link {
      min-width: 116px;
      text-align: center;
      border: 1px solid var(--ink);
      border-radius: 6px;
      color: var(--ink);
      padding: 8px 10px;
      text-decoration: none;
    }

    .shots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .shot {
      min-height: 120px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f2f1ec;
      overflow: hidden;
    }

    .shot img {
      width: 100%;
      display: block;
    }

    .shot-label {
      padding: 8px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--line);
      background: #fbfbf9;
    }

    .feedback {
      display: grid;
      grid-template-columns: minmax(0, 140px) minmax(0, 180px) minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      align-items: center;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    select,
    textarea,
    input[type="radio"] {
      font: inherit;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .overall {
      margin-top: 20px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 12px 0 0;
      padding: 12px;
      background: #111;
      color: #f7f7f4;
      border-radius: 6px;
      max-height: 280px;
      overflow: auto;
    }

    .empty {
      color: var(--warn);
      padding: 16px;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent), white 35%);
      outline-offset: 2px;
    }

    @media (max-width: 760px) {
      .header-inner,
      .variant-head,
      .feedback {
        display: block;
      }

      .meta,
      .open-link {
        display: inline-block;
        margin-top: 10px;
      }

      .shots {
        grid-template-columns: 1fr;
      }

      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>__GSTACK_FEATURE_TITLE__</h1>
      <div class="meta">Generated __GSTACK_GENERATED_AT__</div>
    </div>
  </header>

  <main>
    <section class="summary" aria-label="Variant summary">
      <table>
        <thead>
          <tr>
            <th>Variant</th>
            <th>Direction</th>
            <th>Summary</th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody id="summary-rows"></tbody>
      </table>
    </section>

    <section class="variants" id="variants" aria-label="Design variants"></section>

    <section class="overall" aria-label="Overall feedback">
      <label for="overall-feedback">Overall notes</label>
      <textarea id="overall-feedback" placeholder="What should carry forward? What should change?"></textarea>
      <div class="actions">
        <button type="button" id="copy-feedback">Copy feedback JSON</button>
        <button type="button" class="secondary" id="download-feedback">Download feedback JSON</button>
      </div>
      <pre id="feedback-output" aria-live="polite"></pre>
    </section>
  </main>

  <script>
    window.GSTACK_DESIGN_VARIANTS = __GSTACK_VARIANTS_JSON__;
    window.GSTACK_RUN_SUMMARY = __GSTACK_RUN_SUMMARY_JSON__;

    const variants = Array.isArray(window.GSTACK_DESIGN_VARIANTS) ? window.GSTACK_DESIGN_VARIANTS : [];
    const summaryRows = document.getElementById('summary-rows');
    const variantsEl = document.getElementById('variants');
    const output = document.getElementById('feedback-output');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function shotMarkup(variant, key, label) {
      const path = variant.screenshots && variant.screenshots[key];
      if (!path) {
        return `<div class="shot"><div class="empty">No ${label} screenshot</div><div class="shot-label">${label}</div></div>`;
      }
      return `<div class="shot"><img src="${escapeHtml(path)}" alt="${escapeHtml(variant.name)} ${label} screenshot"><div class="shot-label">${label}</div></div>`;
    }

    function render() {
      if (!variants.length) {
        variantsEl.innerHTML = '<div class="empty">No variants were provided.</div>';
        return;
      }

      summaryRows.innerHTML = variants.map((variant) => `
        <tr>
          <td><strong>${escapeHtml(variant.id)}</strong> ${escapeHtml(variant.name)}</td>
          <td>${escapeHtml(variant.dimension || '')}</td>
          <td>${escapeHtml(variant.summary || '')}</td>
          <td><a href="${escapeHtml(variant.file)}" target="_blank" rel="noreferrer">Open</a></td>
        </tr>
      `).join('');

      variantsEl.innerHTML = variants.map((variant, index) => `
        <article class="variant" data-variant="${escapeHtml(variant.id)}">
          <div class="variant-head">
            <div>
              <h2 class="variant-title">${escapeHtml(variant.id)}. ${escapeHtml(variant.name)}</h2>
              <p class="variant-desc">${escapeHtml(variant.summary || '')}</p>
            </div>
            <a class="open-link" href="${escapeHtml(variant.file)}" target="_blank" rel="noreferrer">Open variant</a>
          </div>
          <div class="shots">
            ${shotMarkup(variant, 'mobile', 'Mobile')}
            ${shotMarkup(variant, 'tablet', 'Tablet')}
            ${shotMarkup(variant, 'desktop', 'Desktop')}
          </div>
          <div class="feedback">
            <div>
              <label>
                <input type="radio" name="preferred" value="${escapeHtml(variant.id)}" ${index === 0 ? 'checked' : ''}>
                Preferred
              </label>
            </div>
            <div>
              <label for="rating-${escapeHtml(variant.id)}">Rating</label>
              <select id="rating-${escapeHtml(variant.id)}" data-rating="${escapeHtml(variant.id)}">
                <option value="5">5 - strongest</option>
                <option value="4">4</option>
                <option value="3" selected>3</option>
                <option value="2">2</option>
                <option value="1">1 - weakest</option>
              </select>
            </div>
            <div>
              <label for="comment-${escapeHtml(variant.id)}">Notes</label>
              <textarea id="comment-${escapeHtml(variant.id)}" data-comment="${escapeHtml(variant.id)}" placeholder="What works or does not work?"></textarea>
            </div>
          </div>
        </article>
      `).join('');
    }

    function collectFeedback() {
      const preferred = document.querySelector('input[name="preferred"]:checked')?.value || null;
      const ratings = {};
      const comments = {};
      for (const variant of variants) {
        ratings[variant.id] = Number(document.querySelector(`[data-rating="${CSS.escape(variant.id)}"]`)?.value || 0);
        comments[variant.id] = document.querySelector(`[data-comment="${CSS.escape(variant.id)}"]`)?.value || '';
      }
      return {
        preferred,
        ratings,
        comments,
        overall: document.getElementById('overall-feedback').value || '',
        generated_at: '__GSTACK_GENERATED_AT__',
        run_summary: window.GSTACK_RUN_SUMMARY || {}
      };
    }

    function updateOutput() {
      output.textContent = JSON.stringify(collectFeedback(), null, 2);
      return output.textContent;
    }

    async function copyFeedback() {
      const json = updateOutput();
      try {
        await navigator.clipboard.writeText(json);
      } catch (error) {
        output.textContent = json + '\n\nCopy failed. Select this JSON manually.';
      }
    }

    function downloadFeedback() {
      const json = updateOutput();
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'feedback.json';
      link.click();
      URL.revokeObjectURL(url);
    }

    render();
    updateOutput();
    document.addEventListener('input', updateOutput);
    document.getElementById('copy-feedback').addEventListener('click', copyFeedback);
    document.getElementById('download-feedback').addEventListener('click', downloadFeedback);
  </script>
</body>
</html>
